<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>細胞探險家</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f2;--card:#fff;--tx:#1f2a24;--mu:#5b6b62;--ac:#2f8f5b;--ok:#2f8f5b;--bad:#d64545;--bd:#d9e2db}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--card:#1e2b24;--tx:#e8f0ea;--mu:#9bb0a3;--ac:#4cc27f;--ok:#4cc27f;--bad:#ff7a7a;--bd:#33463b}}
:root[data-theme="dark"]{--bg:#15201a;--card:#1e2b24;--tx:#e8f0ea;--mu:#9bb0a3;--ac:#4cc27f;--ok:#4cc27f;--bad:#ff7a7a;--bd:#33463b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:1.5rem;margin:4px 0}.sub{color:var(--mu);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.hud{position:sticky;top:0;z-index:5;padding:10px}.hr{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-weight:700}
.hr .sm{width:auto;flex:1;margin:0;text-align:center}.tbar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden}.tbar i{display:block;height:100%;width:100%}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}
.img{background:#fff;border-radius:10px;text-align:center}.img svg{width:100%;max-height:52vh}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac);color:#fff;font-size:.85rem}
.q{font-weight:700;margin:0 0 8px}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
button{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{cursor:default}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.nx{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;width:100%;font-weight:700}.nx:disabled{opacity:.4}
.sm{padding:6px 10px;width:100%;text-align:center;margin-top:6px}.fb{font-size:.9rem;color:var(--mu);margin-top:6px;min-height:1.3em}
.lock{text-align:center}.big{font-size:2.4rem}.big2{font-size:1.5rem;font-weight:800;text-align:center;margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.lvc{display:flex;justify-content:space-between;align-items:center;gap:10px}.go{width:auto;padding:10px 18px}
svg.clk{cursor:crosshair;touch-action:manipulation}
#ov{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.mc{max-width:420px;width:100%;margin:0}
#toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none;font-weight:700}
input{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:8px;width:100%;box-sizing:border-box}
.rw{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.rw:last-child{border:0}.rn{min-width:8.5em}.boss{background:color-mix(in srgb,#d64545 14%,var(--card));border:2px solid #d64545;border-radius:10px;padding:8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:color-mix(in srgb,var(--ok) 18%,var(--card));border:1px solid var(--ok);border-radius:8px;padding:2px 8px;font-size:.9rem}
.lbr{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--bd);font-size:.92rem}.lbr.me{font-weight:700;color:var(--ac)}.lbr span:nth-child(2){flex:1}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;border-radius:99px;padding:12px 18px;background:var(--ac);color:#fff;border:0;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@keyframes p{0%,100%{r:7}50%{r:13}}.pulse{animation:p 1.2s infinite}
</style></head><body><main><div id="app"></div></main><div id="ov"></div><div id="toast"></div>

if(n<3)$("r0").onclick=()=>begin(n+1);$("r1").onclick=()=>begin(n);$("r2").onclick=cover}
function modal(h){if(G.lv&&!G.paused&&!G.over){G.paused=true;G.pa=Date.now()}$("ov").innerHTML=`<div class="card mc">${h}</div>`;$("ov").style.display="flex"}
function closeM(){$("ov").style.display="none";if(G.paused){G.qs+=Date.now()-G.pa;G.paused=false}}
function pauseM(){modal(`<h2 style="text-align:center">⏸ 暫停中</h2><button class="nx" id="m1">繼續遊戲</button><button class="sm" id="m2">🏠 回主畫面</button>`);$("m1").onclick=closeM;$("m2").onclick=homeM}
function homeM(){if(G.over)return cover();modal(`<h3>回主畫面？</h3><p>回到主畫面的話，這一關目前的分數會歸零，確定要離開嗎？</p><button class="nx" id="m1">繼續遊戲</button><button class="sm" id="m2">確定離開</button>`);$("m1").onclick=closeM;$("m2").onclick=()=>{closeM();cover()}}
function shopM(){modal(`<h3>🛒 商店　<small>🪙${G.coins}　${"❤️".repeat(G.lives)}</small></h3>${ITEMS.map((it,i)=>`<div class="card lvc" style="margin:6px 0"><div><b>${it[0]}</b><br><small>${it[1]}</small></div><button class="sm buy" data-i="${i}" style="width:auto" ${G.coins<it[2]||(i>0&&G.lives>=5)?"disabled":""}>🪙${it[2]}</button></div>`).join("")}<button class="nx" id="m1">關閉</button>`);
$("m1").onclick=closeM;document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>{const it=ITEMS[+b.dataset.i];if(G.coins<it[2])return;G.coins-=it[2];it[3]();hud();closeM();shopM()})}
function useHint(){if(G.over)return;if(!G.hints)return toast("沒有提示卡，可到 🛒 商店購買");if(!G.hintFn)return;G.hints--;G.hintUsed=true;hud();G.hintFn()}
/* ===== 第一關：找構造 ===== */
function l1(){if(G.i>=G.order.length)return finish();const k=G.order[G.i],cs=[];let dn=0;newQ(15);
$("body").innerHTML=`<div class="prog"><i style="width:${G.i/G.order.length*100}%"></i></div><div class="card"><p class="sub" style="margin:0">第 ${G.i+1} / ${G.order.length} 題・請在兩種細胞圖上點出：</p><div class="big2">👉 ${S[k].n}</div><p class="sub" style="margin:0;text-align:center">如果細胞沒有這個構造，請按「沒有此構造」。答錯後要點出正確答案才能繼續。</p></div>
<div class="two">${["animal","plant"].map(c=>{const m=IMG[c];return `<div class="card" data-c="${c}"><span class="tag">${c==="animal"?"動物細胞":"植物細胞"}</span><div class="img"><svg class="clk" viewBox="0 0 ${m.w} ${m.h}"><image href="${m.src}" width="${m.w}" height="${m.h}"/><g class="ov"></g></svg></div><button class="sm no">🚫 沒有此構造</button><div class="fb"></div></div>`}).join("")}</div><button class="nx" disabled>${G.i+1>=G.order.length?"完成第一關 ➜":"下一題 ➜"}</button>`;
document.querySelectorAll("#body .card[data-c]").forEach(card=>{const c=card.dataset.c,svg=card.querySelector("svg"),ov=card.querySelector(".ov"),fb=card.querySelector(".fb"),no=card.querySelector(".no"),h=(H[c]||{})[k],o={fin:false,w:false,rv:false};
const reveal=()=>{if(!h||o.rv)return;o.rv=true;let g="";(h.c||[]).forEach(([a,b,r])=>g+=`<circle cx="${a}" cy="${b}" r="${r}" fill="rgba(47,143,91,.15)" stroke="#2f8f5b" stroke-width="3" stroke-dasharray="6 4"/>`);if(h.g)g+=gpath(h.g);ov.innerHTML+=g};
o.hint=()=>{if(!o.fin)reveal()};cs.push(o);
const mark=(ok,x,y)=>{if(x!=null)ov.innerHTML+=`<text x="${x}" y="${y+10}" font-size="30" text-anchor="middle">${ok?"✅":"❌"}</text>`};
const good=(x,y)=>{if(o.fin||G.over)return;if(!o.w)award(10,5);o.fin=true;mark(true,x,y);fb.textContent=(o.w?"這才是正確答案。":"答對了！")+(k==="vac"?"（動物細胞的液泡小而多，植物細胞通常只有一個大液泡。）":"");fb.style.color="var(--ok)";no.disabled=true;if(++dn===2){G.frozen=true;document.querySelector("#body .nx").disabled=false}};
const bad=(msg,x,y)=>{if(o.fin||G.over)return;if(!o.w){o.w=true;wrong();if(G.over)return}mark(false,x,y);reveal();fb.textContent=msg;fb.style.color="var(--bad)"};
svg.onclick=e=>{if(o.fin)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());
if(!h)return bad("這個細胞沒有"+S[k].n+"，請按「沒有此構造」。",q.x,q.y);hit(c,k,q.x,q.y)?good(q.x,q.y):bad("位置不對，請點選綠色區域。",q.x,q.y)};
no.onclick=()=>h?bad("這個細胞有"+S[k].n+"，請點選綠色區域。"):good()});
G.hintFn=()=>cs.forEach(o=>o.hint());document.querySelector("#body .nx").onclick=()=>{G.i++;l1()}}
/* ===== 第二關：配對（整關倒數） ===== */
const opts=(k,f)=>{const c=S[k][f];if(f==="t")return TYPES;return sh([c,...sh(Object.keys(S).filter(z=>S[z][f]!==c).map(z=>S[z][f])).slice(0,3)])};
function l2(){if(G.i>=G.order.length){G.frozen=true;return finish()}const [c,k,x,y,dx,dy]=G.order[G.i],m=IMG[c];let dn=0;G.hintUsed=false;
$("body").innerHTML=`<div class="prog"><i style="width:${G.i/G.order.length*100}%"></i></div><div class="card"><span class="tag">${c==="animal"?"這是動物細胞":"這是植物細胞"}</span><div class="img"><svg viewBox="-70 -40 ${m.w+140} ${m.h+80}"><image href="${m.src}" width="${m.w}" height="${m.h}"/>${arrow(x,y,dx,dy)}</svg></div><p class="sub" style="margin-top:8px">第 ${G.i+1} / ${G.order.length} 題・紅色箭頭指的是哪一個構造？（答錯後要點出正確答案才能繼續）</p></div>
${[["n","① 名稱是什麼？"],["f","② 它的功能是什麼？"],["t","③ 它存在於哪種細胞？"]].map(([f,t])=>`<div class="card" data-f="${f}"><p class="q">${t}</p><div class="opts">${opts(k,f).map(o=>`<button>${o}</button>`).join("")}</div><div class="fb"></div></div>`).join("")}<button class="nx" disabled>${G.i+1>=G.order.length?"完成第二關 ➜":"下一題 ➜"}</button>`;
const rows=[...document.querySelectorAll("#body .card[data-f]")];
G.hintFn=()=>rows.forEach(r=>{if(r.dataset.d)return;const en=[...r.querySelectorAll("button")].filter(b=>!b.disabled),w=en.filter(b=>b.textContent!==S[k][r.dataset.f]);w.slice(0,Math.max(0,en.length-2)).forEach(b=>{b.disabled=true;b.style.opacity=.3})});
rows.forEach(card=>{const f=card.dataset.f;card.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(G.over||card.dataset.d)return;const right=b.textContent===S[k][f],fb=card.querySelector(".fb");
if(!right){if(!card.dataset.w){card.dataset.w=1;wrong();if(G.over)return}b.disabled=true;b.classList.add("bad");fb.textContent="答錯了，請再點選正確答案";fb.style.color="var(--bad)";return}
card.dataset.d=1;if(!card.dataset.w)award(10,5);card.querySelectorAll("button").forEach(z=>{z.disabled=true;z.style.opacity=1;if(z.textContent===S[k][f])z.classList.add("ok")});
fb.textContent=card.dataset.w?"這才是正確答案。":"答對了！";fb.style.color="var(--ok)";if(++dn===3)document.querySelector("#body .nx").disabled=false})});
document.querySelector("#body .nx").onclick=()=>{G.i++;l2()}}
/* ===== 第三關：細胞組裝師 ===== */
function l3(){const found=new Set(),sel=new Set();let fails=0;newQ(60);const nm=k=>k==="dna"?"DNA":S[k].n;
$("body").innerHTML=`<div class="card"><p class="q">🧪 挑選下方卡片，按下「組裝」，看看能組成哪一種細胞！</p><p class="sub" style="margin:0">目標：組裝出 4 種細胞。成功 +30 分，每種細胞 60 秒內組出有額外加分。其中 🦠 細菌是魔王題，分數兩倍！</p></div>
<div class="card" id="slots"></div><div class="card"><div class="opts" id="cards">${C.map(c=>`<button data-k="${c.k}"><b>${c.n}</b><br><small>${c.f}</small></button>`).join("")}</div></div>
<div class="two"><button class="nx" id="mk">⚙️ 組裝</button><button class="sm" id="cl" style="margin:0">清除選取</button></div><div class="card" id="res" style="margin-top:12px"><span class="sub">結果會顯示在這裡</span></div><button class="nx" id="fin" style="display:none">完成挑戰 ➜</button>`;
const res=h=>$("res").innerHTML=h,slots=()=>$("slots").innerHTML=R.map(r=>`<div class="rw${r.boss?" boss":""}"><b class="rn">${r.e} ${r.n}${r.boss?`<br><span class="tag" style="background:#d64545">👹 魔王題・分數 ×2</span>`:""}</b><div class="chips">${found.has(r.n)?r.parts.map(p=>`<span class="chip">${nm(p)}</span>`).join(""):'<span class="sub" style="margin:0">❓ 尚未組裝</span>'}</div></div>`).join("");slots();
const cards=document.querySelectorAll("#cards button");
cards.forEach(b=>b.onclick=()=>{if(G.frozen&&found.size<R.length)newQ(60);const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("ok",sel.has(k))});
$("cl").onclick=()=>{sel.clear();cards.forEach(b=>b.classList.remove("ok"))};
G.hintFn=()=>{const r=R.find(r=>!found.has(r.n));if(r)res(`💡 提示：「${r.n}」需要 ${r.parts.length} 張卡片，其中一張是「${nm(r.parts[0])}」。`)};
$("mk").onclick=()=>{if(G.over)return;if(!sel.size)return res("請先選幾張卡片喔！");
const s=new Set(sel),both=s.has("nuc")&&s.has("dna");if(s.has("nuc"))s.delete("dna");
const note=both?"<br><small>細胞核裡面本來就有 DNA，所以不用另外放 DNA 卡片。</small>":"";
const m=R.find(r=>r.parts.length===s.size&&r.parts.every(p=>s.has(p)));
if(m){if(found.has(m.n))return res(`你已經組裝過「${m.n}」囉！試試其他組合。`+note);found.add(m.n);m.boss?award(60,30,2):award(30,15);G.frozen=true;res(`🎉 組裝成功：${m.e} <b>${m.n}</b><br>${m.d}`+note);slots();if(found.size===R.length)$("fin").style.display="block"}
else{fails++;wrong();if(G.over)return;let t="這個組合還不能組成指定的細胞，再想想看！（−1 ❤️）";
if(fails>=3){const c=R.map(r=>({r,mi:r.parts.filter(p=>!s.has(p)).length,ex:[...s].filter(p=>!r.parts.includes(p)).length})).sort((x,y)=>x.mi+x.ex-y.mi-y.ex)[0];t+=`<br><small>提示：和「${c.r.n}」比，少了 ${c.mi} 張、多了 ${c.ex} 張卡片。</small>`}res(t+note)}};
$("fin").onclick=finish}
cover();
</script></body></html>
